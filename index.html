<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pindai Kode</title>
<style>
:root{--bg:#f3f6f4;--surface:#fff;--ink:#14231c;--muted:#5d6e65;--line:#d5ded9;--accent:#0f7a55;--accent-ink:#fff;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--surface:#17221c;--ink:#e8f1ec;--muted:#93a69c;--line:#2a3a32;--accent:#3ecf9a;--accent-ink:#06241a;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1612;--surface:#17221c;--ink:#e8f1ec;--muted:#93a69c;--line:#2a3a32;--accent:#3ecf9a;--accent-ink:#06241a;--danger:#ff8a80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--muted)}
.view{position:relative;aspect-ratio:1/1;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:18% 18%;border:3px solid var(--accent);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#cfe;padding:24px}
.row{display:flex;gap:10px;margin:14px 0}
button,label.btn{flex:1;font:inherit;font-weight:600;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,label.btn:focus-within,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#msg{color:var(--danger);min-height:1.4em;margin:0 0 8px;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card .val{word-break:break-all;margin:0 0 10px;font-size:1.02rem}
.card .meta{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}
.card .acts button,.card .acts a{flex:0 0 auto;padding:8px 12px;font-size:.9rem;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;font-weight:600}
.card .acts a.open{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h2{font-size:1.05rem;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
h2 button{flex:none;padding:6px 10px;font-size:.85rem}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Pindai Kode</h1>
<p class="sub">Arahkan kamera ke barcode atau QR. Hasilnya bisa disalin atau dibuka.</p>
<div class="view">
  <video id="v" playsinline muted></video>
  <div class="frame" id="frame" hidden></div>
  <div class="idle" id="idle">Tekan “Mulai kamera” untuk memindai</div>
</div>
<div class="row">
  <button class="primary" id="toggle">Mulai kamera</button>
  <label class="btn">Pilih foto<input id="file" type="file" accept="image/*" hidden></label>
</div>
<p id="msg" role="status"></p>
<h2>Riwayat <button id="clear">Hapus semua</button></h2>
<div id="list"><p class="empty">Belum ada hasil pindaian.</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function(){
  var v=document.getElementById('v'),msg=document.getElementById('msg'),list=document.getElementById('list');
  var toggle=document.getElementById('toggle'),idle=document.getElementById('idle'),frame=document.getElementById('frame');
  var stream=null,running=false,detector=null,history=[],last='',lastT=0;
  var canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
  try{var s=localStorage.getItem('scan-history');if(s)history=JSON.parse(s)||[];}catch(e){}
  if('BarcodeDetector' in window){try{detector=new BarcodeDetector();}catch(e){}}

  function save(){try{localStorage.setItem('scan-history',JSON.stringify(history.slice(0,30)));}catch(e){}}
  function isUrl(t){return /^https?:\/\/\S+$/i.test(t);}
  function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;}

  function render(){
    if(!history.length){list.innerHTML='<p class="empty">Belum ada hasil pindaian.</p>';return;}
    list.innerHTML=history.map(function(h,i){
      var link=isUrl(h.text);
      return '<div class="card"><p class="val">'+esc(h.text)+'</p><p class="meta">'+esc(h.format)+' · '+esc(h.time)+(link?' · Tautan':' · Teks')+'</p><div class="acts">'
        +(link?'<a class="open" href="'+esc(h.text)+'" target="_blank" rel="noopener noreferrer">Buka tautan</a>':'')
        +'<button data-copy="'+i+'">Salin</button><button data-del="'+i+'">Hapus</button></div></div>';
    }).join('');
  }
  list.addEventListener('click',function(e){
    var c=e.target.getAttribute('data-copy'),d=e.target.getAttribute('data-del');
    if(c!==null){var t=history[c].text;
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){e.target.textContent='Tersalin';}).catch(function(){
        var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');e.target.textContent='Tersalin';}catch(x){msg.textContent='Gagal menyalin. Tekan lama teks untuk menyalin manual.';}document.body.removeChild(ta);});}
    if(d!==null){history.splice(d,1);save();render();}
  });
  document.getElementById('clear').onclick=function(){history=[];save();render();};

  function add(text,format){
    var now=Date.now();if(text===last&&now-lastT<3000)return;last=text;lastT=now;
    history.unshift({text:text,format:format,time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})});
    history=history.slice(0,30);save();render();msg.textContent='';
    if(navigator.vibrate)navigator.vibrate(60);
  }

  async function detect(source,w,h){
    if(detector){
      try{var r=await detector.detect(source);if(r.length)return {text:r[0].rawValue,format:r[0].format.replace('_',' ').toUpperCase()};}catch(e){}
    }
    if(window.jsQR){
      canvas.width=w;canvas.height=h;ctx.drawImage(source,0,0,w,h);
      var img=ctx.getImageData(0,0,w,h),c=jsQR(img.data,w,h);
      if(c)return {text:c.data,format:'QR CODE'};
    }
    return null;
  }

  async function loop(){
    if(!running)return;
    if(v.readyState>=2&&v.videoWidth){
      var r=await detect(v,v.videoWidth,v.videoHeight);
      if(r)add(r.text,r.format);
    }
    setTimeout(function(){requestAnimationFrame(loop);},150);
  }

  async function start(){
    msg.textContent='';
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      v.srcObject=stream;await v.play();running=true;idle.hidden=true;frame.hidden=false;toggle.textContent='Hentikan kamera';loop();
    }catch(e){
      msg.textContent='Kamera tidak bisa diakses. Izinkan akses kamera di browser, atau gunakan “Pilih foto”.';
    }
  }
  function stop(){running=false;if(stream)stream.getTracks().forEach(function(t){t.stop();});stream=null;v.srcObject=null;idle.hidden=false;frame.hidden=true;toggle.textContent='Mulai kamera';}
  toggle.onclick=function(){running?stop():start();};

  document.getElementById('file').onchange=async function(e){
    var f=e.target.files[0];if(!f)return;msg.textContent='';
    try{
      var bmp=await createImageBitmap(f);
      var r=await detect(bmp,bmp.width,bmp.height);
      if(r)add(r.text,r.format);else msg.textContent='Tidak ada kode yang terbaca di foto ini. Coba foto yang lebih jelas dan dekat.';
    }catch(x){msg.textContent='Foto tidak bisa dibaca.';}
    e.target.value='';
  };
  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Notes & Habits</title>
<style>
  :root{
    /* ===== Color tokens ===== */
    --sky-1:#eef2fb;
    --sky-2:#e3e9f7;
    --sky-3:#eef1f8;
    --glass-bg: rgba(255,255,255,0.46);
    --glass-bg-strong: rgba(255,255,255,0.68);
    --glass-border: rgba(255,255,255,0.75);
    --glass-border-soft: rgba(255,255,255,0.5);
    --glass-shadow: 0 10px 40px rgba(31,41,80,0.12), 0 2px 8px rgba(31,41,80,0.06);
    --glass-shadow-lg: 0 20px 60px rgba(31,41,80,0.18), 0 4px 14px rgba(31,41,80,0.08);
    --accent: #FF9F45;
    --accent-2: #FF7A59;
    --accent-grad: linear-gradient(135deg,#FFB25E 0%, #FF7A59 100%);
    --habit-accent: #34C759;
    --habit-grad: linear-gradient(135deg,#5FDE84 0%, #26B85C 100%);
    --danger: #FF3B30;
    --text-primary: #1c1c1e;
    --text-secondary: rgba(60,60,67,0.62);
    --text-tertiary: rgba(60,60,67,0.42);
    --divider: rgba(60,60,67,0.13);
    --scrim: rgba(20,22,35,0.28);

    /* ===== Radius ===== */
    --r-xl: 30px;
    --r-lg: 24px;
    --r-md: 18px;
    --r-sm: 12px;
    --r-pill: 999px;

    /* ===== Spacing ===== */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 20px;
    --sp-6: 28px;
    --sp-7: 36px;

    /* ===== Motion ===== */
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --dur-fast: 200ms;
    --dur-med: 280ms;
    --dur-slow: 350ms;

    --tabbar-h: 84px;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    height: 100%;
    overscroll-behavior-y: none;
  }

  body{
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-primary);
    background:
      radial-gradient(1200px 800px at 15% -10%, #fdf1e6 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 10%, #e6ecfb 0%, transparent 50%),
      linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 45%, var(--sky-3) 100%);
    background-attachment: fixed;
    min-height: 100%;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #app{
    position: relative;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 var(--sp-5) calc(var(--tabbar-h) + 40px);
    min-height: 100vh;
  }

  /* ===================== HEADER ===================== */
  header.topbar{
    position: sticky;
    top: 0;
    z-index: 20;
    padding: max(env(safe-area-inset-top), 22px) var(--sp-1) var(--sp-4);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    background: linear-gradient(180deg, rgba(238,242,251,0.9) 0%, rgba(238,242,251,0.55) 80%, rgba(238,242,251,0));
    margin: 0 calc(var(--sp-5) * -1) 0;
    padding-left: var(--sp-5);
    padding-right: var(--sp-5);
  }

  h1.page-title{
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
    line-height: 1.05;
    transition: opacity var(--dur-fast) var(--ease);
  }

  .add-btn{
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: var(--accent-grad);
    box-shadow: 0 8px 22px rgba(255,122,89,0.4), inset 0 1px 1px rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
  }
  .add-btn.habit-mode{
    background: var(--habit-grad);
    box-shadow: 0 8px 22px rgba(38,184,92,0.4), inset 0 1px 1px rgba(255,255,255,0.6);
  }
  .add-btn svg{ width: 22px; height: 22px; }
  .add-btn:hover{ transform: translateY(-1px) scale(1.03); }
  .add-btn:active{ transform: scale(0.92); }

  /* ===================== VIEWS ===================== */
  .view{ display: none; }
  .view.active{ display: block; animation: fadeUp var(--dur-med) var(--ease) both; }

  /* ===================== NOTES GRID ===================== */
    /* ===================== NOTES GRID ===================== */
  .notes-grid{
    margin-top: var(--sp-5);
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--sp-4);
  }
    .note-card{
    position: relative;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-lg);
    padding: var(--sp-5);
    min-height: 168px;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: var(--glass-shadow);
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
    overflow: visible;
    animation: cardIn var(--dur-slow) var(--ease) both;
    transition: transform var(--dur-med) var(--ease), box-shadow var(--dur-med) var(--ease), background var(--dur-med) var(--ease), opacity var(--dur-med) var(--ease), filter var(--dur-med) var(--ease);
  }
  .note-card::before{
    content:"";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0) 45%);
    pointer-events: none;
  }
  .note-card:hover{ transform: translateY(-3px); box-shadow: var(--glass-shadow-lg); background: var(--glass-bg-strong); }
  .note-card:active{ transform: scale(0.975) translateY(0); }

  @keyframes cardIn{ from{ opacity: 0; transform: translateY(14px) scale(0.97); } to{ opacity: 1; transform: translateY(0) scale(1); } }

  .note-title{ font-size: 17px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-preview{ font-size: 14px; color: var(--text-secondary); line-height: 1.45; margin: 0; flex: 1; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .note-date{ margin-top: var(--sp-3); font-size: 12px; font-weight: 600; color: var(--text-tertiary); }

  /* ===================== EMPTY STATE (shared) ===================== */
  .empty-state{
    margin-top: 16vh;
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    color: var(--text-secondary);
    animation: fadeUp var(--dur-slow) var(--ease) both;
  }
  .empty-state.show{ display: flex; }
  .empty-state .icon{
    width: 74px; height: 74px;
    border-radius: var(--r-md);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--glass-shadow);
    margin-bottom: var(--sp-5);
  }
  .empty-state .icon svg{ width: 34px; height: 34px; color: var(--text-tertiary); }
  .empty-state h2{ font-size: 20px; margin: 0 0 6px; color: var(--text-primary); font-weight: 700; }
  .empty-state p{ margin: 0; font-size: 14px; }

  @keyframes fadeUp{ from{ opacity: 0; transform: translateY(10px); } to{ opacity: 1; transform: translateY(0); } }

  /* ===================== HABITS LIST ===================== */
  .habits-list{
    margin-top: var(--sp-5);
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
  }

  .habit-card{
    position: relative;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-lg);
    padding: var(--sp-5);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: var(--glass-shadow);
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
    animation: cardIn var(--dur-slow) var(--ease) both;
    transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
  }
  .habit-card:hover{ transform: translateY(-2px); box-shadow: var(--glass-shadow-lg); }

  .habit-top{ display: flex; align-items: center; gap: var(--sp-3); cursor: pointer; }
  .habit-emoji{
    width: 46px; height: 46px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.5);
  }
  .habit-info{ flex: 1; min-width: 0; }
  .habit-name{ font-size: 16px; font-weight: 700; margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .habit-streak{ font-size: 13px; color: var(--text-secondary); font-weight: 600; margin: 0; }   .habit-progress-wrap{ display: flex; align-items: center; gap: 8px; margin-top: 6px; }   .habit-progress-track{ flex: 1; height: 6px; background: rgba(120,120,128,0.12); border-radius: var(--r-pill); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); }   .habit-progress-fill{ height: 100%; border-radius: var(--r-pill); transition: width var(--dur-med) var(--ease-spring); position: relative; }   .habit-progress-fill::after{ content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 100%); border-radius: inherit; }   .habit-progress-text{ font-size: 11px; font-weight: 700; color: var(--text-tertiary); min-width: 32px; text-align: right; } 

  .habit-check{
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 2px solid var(--divider);
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all var(--dur-fast) var(--ease-spring);
  }
  .habit-check svg{ width: 18px; height: 18px; opacity: 0; transform: scale(0.5); transition: all var(--dur-fast) var(--ease-spring); }
  .habit-check.done{ border-color: transparent; }
  .habit-check.done svg{ opacity: 1; transform: scale(1); }
  .habit-check:active{ transform: scale(0.88); }

  .habit-week{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .week-day{ display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .week-day .dow{ font-size: 10px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.02em; }
  .week-dot{
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--divider);
    display: flex; align-items: center; justify-content: center;
    transition: all var(--dur-fast) var(--ease);
  }
  .week-dot.filled{ border-color: transparent; }
  .week-dot.filled svg{ width: 12px; height: 12px; }
  .week-dot.is-today{ box-shadow: 0 0 0 2px var(--habit-accent); }

  /* ===================== EMPTY STATE (habits variant reuse) ===================== */

  /* ===================== TAB BAR ===================== */
  .tabbar{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 35;
    display: flex;
    justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
    pointer-events: none;
  }
  .tabbar-inner{
    pointer-events: auto;
    display: flex;
    gap: var(--sp-6);
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    box-shadow: var(--glass-shadow-lg);
    border-radius: var(--r-pill);
    padding: 10px 30px;
    margin-bottom: 14px;
  }
  .tab-btn{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
    padding: 4px 10px;
    color: var(--text-tertiary);
    transition: color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  }
  .tab-btn svg{ width: 24px; height: 24px; transition: transform var(--dur-fast) var(--ease-spring); }
  .tab-btn span{ font-size: 11px; font-weight: 700; }
  .tab-btn:active{ transform: scale(0.9); }
  .tab-btn.active{ color: var(--accent-2); }
  .tab-btn.active[data-tab="habits"]{ color: var(--habit-accent); }
  .tab-btn.active svg{ transform: translateY(-1px) scale(1.05); }

  /* ===================== SCRIM ===================== */
  .scrim{
    position: fixed;
    inset: 0;
    background: var(--scrim);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-med) var(--ease);
    z-index: 40;
  }
  .scrim.show{ opacity: 1; pointer-events: auto; }

  /* ===================== BOTTOM SHEET ===================== */
  .sheet{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    max-width: 640px;
    margin: 0 auto;
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    border-bottom: none;
    border-radius: 28px 28px 0 0;
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 -10px 50px rgba(31,41,80,0.25);
    padding: var(--sp-3) var(--sp-5) calc(var(--sp-6) + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform var(--dur-slow) var(--ease-spring);
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .sheet.show{ transform: translateY(0); }

  .sheet-handle{ width: 40px; height: 5px; border-radius: var(--r-pill); background: rgba(60,60,67,0.25); margin: 6px auto 14px; flex-shrink: 0; }

  .sheet-header{ display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-4); flex-shrink: 0; }
  .sheet-header .sheet-title{ font-size: 17px; font-weight: 700; }

  .text-btn{ background: none; border: none; font-size: 16px; font-family: inherit; cursor: pointer; padding: var(--sp-2); border-radius: var(--r-sm); transition: opacity var(--dur-fast) var(--ease); }
  .text-btn:active{ opacity: 0.5; }
  .text-btn.cancel{ color: var(--text-secondary); }
  .text-btn.save{ color: var(--accent-2); font-weight: 700; }
  .text-btn.save.habit-color{ color: var(--habit-accent); }

  .field-title{ width: 100%; border: none; background: transparent; font-size: 22px; font-weight: 800; font-family: inherit; color: var(--text-primary); padding: var(--sp-2) 0; outline: none; }
  .field-title::placeholder{ color: var(--text-tertiary); }

  .field-divider{ height: 1px; background: var(--divider); margin: var(--sp-1) 0 var(--sp-3); flex-shrink: 0; }

  .field-body{ width: 100%; flex: 1; min-height: 160px; border: none; background: transparent; resize: none; font-size: 16px; line-height: 1.55; font-family: inherit; color: var(--text-primary); outline: none; }
  .field-body::placeholder{ color: var(--text-tertiary); }

  .field-label{ font-size: 12px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; margin: var(--sp-4) 0 var(--sp-2); }

  .emoji-grid, .color-grid{ display: flex; flex-wrap: wrap; gap: 10px; }
  .emoji-opt{
    width: 44px; height: 44px;
    border-radius: 13px;
    border: 2px solid transparent;
    background: rgba(120,120,128,0.10);
    font-size: 21px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all var(--dur-fast) var(--ease-spring);
  }
  .emoji-opt.selected{ border-color: var(--habit-accent); background: rgba(52,199,89,0.14); transform: scale(1.05); }
  .color-opt{
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
    transition: all var(--dur-fast) var(--ease-spring);
  }
  .color-opt.selected{ border-color: rgba(0,0,0,0.35); transform: scale(1.12); }

  /* ===================== DETAIL VIEW (shared structure) ===================== */
  .detail-view{
    position: fixed;
    inset: 0;
    z-index: 25;
    background:
      radial-gradient(1200px 800px at 15% -10%, #fdf1e6 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 10%, #e6ecfb 0%, transparent 50%),
      linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 45%, var(--sky-3) 100%);
    transform: translateX(100%);
    transition: transform var(--dur-slow) var(--ease);
    overflow-y: auto;
    display: none;
  }
  .detail-view.show{ display: block; }
  .detail-view.enter{ transform: translateX(0); }

  .detail-inner{ max-width: 760px; margin: 0 auto; padding: max(env(safe-area-inset-top),22px) var(--sp-5) 100px; }

  .detail-topbar{ display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-6); }

  .back-btn{
    display: flex; align-items: center; gap: 4px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px);
    color: var(--accent-2);
    font-size: 16px; font-weight: 600;
    padding: 8px 14px 8px 10px;
    border-radius: var(--r-pill);
    cursor: pointer;
    box-shadow: var(--glass-shadow);
    transition: transform var(--dur-fast) var(--ease);
  }
  .back-btn.habit-color{ color: var(--habit-accent); }
  .back-btn:active{ transform: scale(0.94); }
  .back-btn svg{ width: 18px; height: 18px; }

  .detail-actions{ display: flex; gap: 8px; }
  .icon-btn{
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: var(--glass-shadow); color: var(--text-primary);
    transition: transform var(--dur-fast) var(--ease);
  }
  .icon-btn:active{ transform: scale(0.9); }
  .icon-btn.danger{ color: var(--danger); }
  .icon-btn svg{ width: 18px; height: 18px; }

  .detail-title{ font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; word-break: break-word; }
  .detail-date{ font-size: 13px; font-weight: 600; color: var(--text-tertiary); margin-bottom: var(--sp-6); }
  .detail-body{ font-size: 17px; line-height: 1.65; color: var(--text-primary); white-space: pre-wrap; word-break: break-word; }

  /* ---- habit detail specific ---- */
  .habit-detail-head{ display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-6); }
  .habit-detail-emoji{ width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: inset 0 1px 1px rgba(255,255,255,0.5); flex-shrink: 0; }

  .stats-row{ display: grid; grid-template-columns: repeat(3,1fr); gap: var(--sp-3); margin-bottom: var(--sp-6); }
  .stat-card{
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: var(--r-md); padding: var(--sp-4);
    text-align: center;
    backdrop-filter: blur(20px);
    box-shadow: var(--glass-shadow);
  }
  .stat-num{ font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .stat-label{ font-size: 11px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 2px; }

  .cal-header{ display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-3); }
  .cal-header .cal-month{ font-size: 16px; font-weight: 700; }
  .cal-nav{ display: flex; gap: 6px; }
  .cal-nav button{
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--glass-border); background: var(--glass-bg);
    backdrop-filter: blur(16px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .cal-nav button svg{ width: 15px; height: 15px; }
  .cal-nav button:disabled{ opacity: 0.3; cursor: default; }

  .cal-grid{ display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
  .cal-dow{ font-size: 10px; font-weight: 700; color: var(--text-tertiary); text-align: center; text-transform: uppercase; padding-bottom: 4px; }
  .cal-cell{
    aspect-ratio: 1;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border-soft);
    cursor: pointer;
    transition: all var(--dur-fast) var(--ease-spring);
    color: var(--text-secondary);
  }
  .cal-cell.empty{ background: transparent; border: none; cursor: default; }
  .cal-cell.future{ opacity: 0.35; cursor: default; }
  .cal-cell.done{ color: #fff; border-color: transparent; }
  .cal-cell.today{ box-shadow: 0 0 0 2px var(--habit-accent); }
  .cal-cell:active{ transform: scale(0.9); }

  /* ===================== CONFIRM DIALOG ===================== */
  .dialog{
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%,-50%) scale(0.9);
    z-index: 60;
    width: min(300px, 84vw);
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-lg);

(function(){

  /** ===== Elements ===== */

  const toastEl = document.getElementById('toast');

  /** ===== Storage ===== */
  function loadAll(){
    try{ notes = JSON.parse(localStorage.getItem(NOTES_KEY) || "[]"); if(!Array.isArray(notes)) notes = []; }
    catch(e){ notes = []; }
    try{ habits = JSON.parse(localStorage.getItem(HABITS_KEY) || "[]"); if(!Array.isArray(habits)) habits = []; }
    catch(e){ habits = []; }
  }
  function persistNotes(){ try{ localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); }catch(e){ showToast("Storage unavailable"); } }
  function persistHabits(){ try{ localStorage.setItem(HABITS_KEY, JSON.stringify(habits)); }catch(e){ showToast("Storage unavailable"); } }

  function uid(prefix){ return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

  function formatDate(ts){
    const d = new Date(ts);
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }
  function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

  function dateKey(d){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayKey(){ return dateKey(new Date()); }

  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 1800);
  }

  /** ===================== TAB SWITCHING ===================== */
          function switchTab(tab){
    activeTab = tab;
    viewHome.classList.toggle('active', tab === 'home');
    viewHero.classList.toggle('active', tab === 'hero');
    viewNotes.classList.toggle('active', tab === 'notes');
    viewHabits.classList.toggle('active', tab === 'habits');
    tabHome.classList.toggle('active', tab === 'home');
    tabHero.classList.toggle('active', tab === 'hero');
    tabNotes.classList.toggle('active', tab === 'notes');
    tabHabits.classList.toggle('active', tab === 'habits');
    pageTitle.textContent = tab === 'home' ? 'Beranda' : (tab === 'hero' ? 'Hero' : (tab === 'notes' ? 'Notes' : 'Habits'));
    addBtn.classList.toggle('habit-mode', tab === 'habits');
    addBtn.classList.toggle('hero-mode', tab === 'hero');
    addBtn.style.display = tab === 'home' ? 'none' : 'flex';
    
    if (tab === 'home') renderHomeWidgets();
    if (tab === 'hero') renderHero();
  }
  tabHome.addEventListener('click', ()=> switchTab('home'));
  tabHero.addEventListener('click', ()=> switchTab('hero'));
  tabNotes.addEventListener('click', ()=> switchTab('notes'));
  tabHabits.addEventListener('click', ()=> switchTab('habits'));
  addBtn.addEventListener('click', ()=>{
    if(activeTab === 'notes') openSheet('create');
    else if(activeTab === 'habits') openHabitSheet('create');
    else if(activeTab === 'hero') openHeroSheet('create');
  });

  /** ===================== NOTES RENDER ===================== */

       function renderNotes(){
    const filtered = notes.filter(n => showArchived ? n.isArchived : !n.isArchived);
    const sorted = filtered.sort((a,b) => {
      if (a.isDone !== b.isDone) return a.isDone ? 1 : -1;
      if (a.isImportant !== b.isImportant) return a.isImportant ? -1 : 1;
      return b.updatedAt - a.updatedAt;
    });

    if(sorted.length === 0){
      notesGrid.style.display = 'none';
      notesEmpty.classList.add('show');
      notesGrid.innerHTML = '';
      return;
    }
    notesGrid.style.display = 'grid';
    notesEmpty.classList.remove('show');
        notesGrid.innerHTML = sorted.map((n,i)=> `
      <div class="note-card ${n.isImportant ? 'is-important' : ''} ${n.isDone ? 'is-done' : ''}" data-id="${n.id}" style="animation-delay:${Math.min(i,8)*35}ms">
        <div class="note-header-row">
          <div class="note-title-wrap">
            ${n.isImportant && !n.isDone ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.1 11.85C20.6 11.25 19.8 11 19 11h-1.5L16 4.5c-.2-1.4-1.4-2.5-2.8-2.5H10.8C9.4 2 8.2 3.1 8 4.5L6.5 11H5c-.8 0-1.6.25-2.1.85-.5.6-.7 1.4-.4 2.15l1.6 4c.4 1 1.4 1.7 2.5 1.7h1.4v2.8c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2v-2.8h1.4c1.1 0 2.1-.7 2.5-1.7l1.6-4c.3-.75.1-1.55-.4-2.15z"/></svg>' : ''}
            <h3 class="note-title">${escapeHtml(n.title || 'Untitled Note')}</h3>
          </div>
          <button class="note-menu-btn" aria-label="Menu">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/><circle cx="5" cy="12" r="2.2"/></svg>
          </button>
                    <div class="note-menu-dropdown">
            <button class="note-menu-item" data-action="edit">Edit</button>
            <button class="note-menu-item" data-action="done">${n.isDone ? 'Batal Selesai' : 'Selesai'}</button>
            <button class="note-menu-item" data-action="archive">${n.isArchived ? 'Batal Arsip' : 'Arsipkan'}</button>
            <button class="note-menu-item danger" data-action="delete">Hapus</button>
          </div>
        </div>
        <p class="note-preview">${escapeHtml(n.body || '')}</p>
        <div class="note-date">${formatDate(n.updatedAt)}</div>
      </div>
    `).join('');

  }

  /** ===================== NOTE SHEET ===================== */
  function openSheet(mode){
    sheetMode = mode;
    sheetTitleLabel.textContent = mode === 'create' ? 'New Note' : 'Edit Note';
        if(mode === 'edit' && activeNoteId){
      const n = notes.find(x=>x.id===activeNoteId);
      fieldTitle.value = n ? n.title : '';
      fieldBody.value = n ? n.body : '';
      fieldImportant.checked = n ? !!n.isImportant : false;
    } else {
      fieldTitle.value = ''; fieldBody.value = '';
      fieldImportant.checked = false;
    }
    scrim.classList.add('show');
    sheet.classList.add('show');
    document.body.style.overflow = 'hidden';
    setTimeout(()=> fieldTitle.focus(), 320);
  }
  function closeSheet(){
    sheet.classList.remove('show');
    if(!habitSheet.classList.contains('show')) scrim.classList.remove('show');
    document.body.style.overflow = '';
    sheetMode = null;
  }
  function saveSheet(){
    const title = fieldTitle.value.trim();
    const body = fieldBody.value.trim();
        if(sheetMode === 'create'){
      notes.push({ id: uid('n'), title: title || 'Untitled Note', body, isImportant: fieldImportant.checked, isDone: false, updatedAt: Date.now() });
      persistNotes(); renderNotes(); closeSheet(); renderHomeWidgets(); showToast('Note created');
    } else if(sheetMode === 'edit' && activeNoteId){
      const n = notes.find(x=>x.id===activeNoteId);
      if(n){ n.title = title || 'Untitled Note'; n.body = body; n.isImportant = fieldImportant.checked; n.updatedAt = Date.now(); persistNotes(); }
      closeSheet(); renderNotes(); openDetail(activeNoteId, false); renderHomeWidgets(); showToast('Note saved');
    }
  }
  sheetCancel.addEventListener('click', closeSheet);
  sheetSave.addEventListener('click', saveSheet);
    if(archiveToggleBtn) {
    archiveToggleBtn.addEventListener('click', () => {
      showArchived = !showArchived;
      archiveToggleBtn.textContent = showArchived ? 'Kembali ke Catatan Aktif' : 'Lihat Arsip Catatan';
      renderNotes();
    });
  }

  notesGrid.addEventListener('click', (e)=>{
    const menuBtn = e.target.closest('.note-menu-btn');
    if(menuBtn){
      e.stopPropagation();
      const card = menuBtn.closest('.note-card');
      const dropdown = menuBtn.nextElementSibling;
      document.querySelectorAll('.note-menu-dropdown').forEach(d => { if(d !== dropdown) d.classList.remove('show') });
      document.querySelectorAll('.note-card, .challenge-card').forEach(c => c.style.zIndex = '');
      dropdown.classList.toggle('show');
      if(dropdown.classList.contains('show')) card.style.zIndex = '99';
      return;
    }
    
    const menuItem = e.target.closest('.note-menu-item');
    if(menuItem){
      e.stopPropagation();
      document.querySelectorAll('.note-menu-dropdown').forEach(d => d.classList.remove('show'));
      document.querySelectorAll('.note-card, .challenge-card').forEach(c => c.style.zIndex = '');
      const card = menuItem.closest('.note-card');
      const id = card.dataset.id;
      const action = menuItem.dataset.action;
      
      if(action === 'edit'){
        activeNoteId = id;
        openSheet('edit');
      } else if(action === 'done'){
        const n = notes.find(x=>x.id===id);
        if(n) { n.isDone = !n.isDone; persistNotes(); renderNotes(); renderHomeWidgets(); }
      } else if(action === 'archive'){
        const n = notes.find(x=>x.id===id);
        if(n) { n.isArchived = !n.isArchived; persistNotes(); renderNotes(); renderHomeWidgets(); showToast(n.isArchived ? 'Diarsipkan' : 'Dikembalikan'); }
      } else if(action === 'delete'){
        activeNoteId = id;
        askDelete('note', id);
      }
      return;
    }

    const card = e.target.closest('.note-card');
    if(!card) {
      document.querySelectorAll('.note-menu-dropdown').forEach(d => d.classList.remove('show'));
      return;
    }
    openDetail(card.dataset.id, true);
  });


  function openDetail(id, animate){
    const n = notes.find(x=>x.id===id);
    if(!n) return;
    activeNoteId = id;
    detailTitle.textContent = n.title || 'Untitled Note';
    detailDate.textContent = 'Edited ' + formatDate(n.updatedAt);
    detailBody.textContent = n.body || '';
    detailView.classList.add('show');
    document.body.style.overflow = 'hidden';
    if(animate === false){ detailView.classList.add('enter'); }
    else{ requestAnimationFrame(()=> requestAnimationFrame(()=> detailView.classList.add('enter'))); }
  }
  function closeDetail(){
    detailView.classList.remove('enter');
    document.body.style.overflow = '';
    setTimeout(()=>{ detailView.classList.remove('show'); activeNoteId = null; }, 350);
  }
  backBtn.addEventListener('click', closeDetail);
  editBtn.addEventListener('click', ()=>{ if(activeNoteId) openSheet('edit'); });
  deleteBtn.addEventListener('click', ()=>{ if(activeNoteId) askDelete('note', activeNoteId); });

  /** ===================== HABITS: streak / stats helpers ===================== */
  function getCompletedDates(h){ return Object.keys(h.completions || {}).filter(k=>h.completions[k]).sort(); }

  function calcCurrentStreak(h){
    const comp = h.completions || {};
    let count = 0;
    let cursor = new Date();
    if(!comp[dateKey(cursor)]){
      cursor.setDate(cursor.getDate()-1);
    }
    while(comp[dateKey(cursor)]){
      count++;
      cursor.setDate(cursor.getDate()-1);
    }
    return count;
  }

  function calcBestStreak(h){
    const dates = getCompletedDates(h);
    if(dates.length===0) return 0;
    let best=1, cur=1;
    for(let i=1;i<dates.length;i++){
      const prev = new Date(dates[i-1]);
      const currD = new Date(dates[i]);
      const diff = Math.round((currD-prev)/86400000);
      if(diff===1){ cur++; } else { cur=1; }
      if(cur>best) best=cur;
    }
    return best;
  }

  function isDoneOn(h, key){ return !!(h.completions && h.completions[key]); }

  /** ===================== HABITS RENDER ===================== */
  const DOW_LETTERS = ["S","M","T","W","T","F","S"];

  function renderHabits(){
    if(habits.length===0){
      habitsList.style.display='none';
      habitsEmpty.classList.add('show');
      habitsList.innerHTML='';
      return;
    }
       habitsList.style.display='flex';
    habitsEmpty.classList.remove('show');

    let bestRecord = 0;
    let bestHabitName = '';
    habits.forEach(h => {
      const b = calcBestStreak(h);
      if(b > bestRecord) { bestRecord = b; bestHabitName = h.name; }
    });
    
    let recordHtml = '';
    if(bestRecord > 0) {
      recordHtml = `<div class="best-record-banner"><span>👑 Rekor Tertinggi: ${escapeHtml(bestHabitName)}</span><span>🔥 ${bestRecord} Hari</span></div>`;
    }

    const today = new Date();
    const weekDates = [];
    for(let i=6;i>=0;i--){
      const d = new Date(today);
      d.setDate(d.getDate()-i);
      weekDates.push(d);
    }

        habitsList.innerHTML = recordHtml + habits.map((h,i)=>{
      const done = isDoneOn(h, todayKey());
      const streak = calcCurrentStreak(h);
      const streakLabel = streak>0 ? `🔥 ${streak} day streak` : 'Start your streak today';
	      let weeklyCompleted = 0;


      const weekHtml = weekDates.map(d=>{
        const key = dateKey(d);
        const filled = isDoneOn(h,key);
		        if(filled) weeklyCompleted++;

        const isToday = key === todayKey();
        return `
          <div class="week-day">
            <span class="dow">${DOW_LETTERS[d.getDay()]}</span>
            <div class="week-dot ${filled?'filled':''} ${isToday?'is-today':''}" style="${filled?`background:${h.color};`:''}">
              ${filled ? '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' : ''}
            </div>
          </div>
        `;
      }).join('');
	      const progressPercent = Math.round((weeklyCompleted / 7) * 100);


      return `
        <div class="habit-card" style="animation-delay:${Math.min(i,8)*35}ms" data-id="${h.id}">
          <div class="habit-top">
            <div class="habit-open" data-id="${h.id}" style="display:flex;align-items:center;gap:var(--sp-3);flex:1;min-width:0;cursor:pointer;">
              <div class="habit-emoji" style="background:${h.color}2a;">${h.emoji}</div>
              <div class="habit-info">
                <p class="habit-name">${escapeHtml(h.name)}</p>
                <p class="habit-streak">${streakLabel}</p>                 <div class="habit-progress-wrap">                   <div class="habit-progress-track">                     <div class="habit-progress-fill" style="width: ${progressPercent}%; background: ${h.color};"></div>                   </div>                   <span class="habit-progress-text">${progressPercent}%</span>                 </div> 
              </div>
            </div>
            <button class="habit-check ${done?'done':''}" data-id="${h.id}" style="${done?`background:${h.color};`:''}" aria-label="Mark done today">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            </button>
          </div>
          <div class="habit-week">${weekHtml}</div>
        </div>
      `;
    }).join('');
  }

  habitsList.addEventListener('click', (e)=>{
    const checkBtn = e.target.closest('.habit-check');
    if(checkBtn){
      toggleCompletion(checkBtn.dataset.id, todayKey());
      return;
    }
    const openArea = e.target.closest('.habit-open');
    if(openArea){
      openHabitDetail(openArea.dataset.id, true);
    }
  });

  function toggleCompletion(id, key){
    const h = habits.find(x=>x.id===id);
    if(!h) return;
    h.completions = h.completions || {};
    if(h.completions[key]) delete h.completions[key];
    else h.completions[key] = true;
    persistHabits();
    renderHabits();
    if(activeHabitId === id){ renderHabitDetail(id); }
  }
    function toggleHero(id) {
    if (completedChallenges.done.includes(id)) {
      completedChallenges.done = completedChallenges.done.filter(x => x !== id);
    } else {
      completedChallenges.done.push(id);
    }
    localStorage.setItem('ios_hero_v1', JSON.stringify(completedChallenges));
    renderHero();
    renderHomeWidgets();
  }

  function renderHero() {
    if(challenges.length === 0){
      heroList.innerHTML = `<div class="empty-state show" style="margin-top: 6vh;"><h2>Tidak Ada Tantangan</h2><p>Tekan + untuk membuat tantangan baru.</p></div>`;
      return;
    }
    heroList.innerHTML = challenges.map((c, i) => {
      const isDone = completedChallenges.done.includes(c.id);
      return `
        <div class="challenge-card ${isDone ? 'done' : ''}" style="animation-delay:${i*35}ms; position: relative;" data-id="${c.id}">
          <div class="challenge-info">
            <h4 class="challenge-title">${escapeHtml(c.title)}</h4>
            <span class="challenge-xp">${escapeHtml(c.xp)}</span>
          </div>
          <button class="sword-btn ${isDone ? 'done' : ''}" data-id="${c.id}" style="margin-right: 8px;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/></svg>
          </button>
          <button class="challenge-menu-btn" aria-label="Menu">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/><circle cx="5" cy="12" r="2.2"/></svg>
          </button>
          <div class="note-menu-dropdown">
            <button class="note-menu-item" data-action="edit-hero">Edit</button>
            <button class="note-menu-item danger" data-action="delete-hero">Hapus</button>
          </div>
        </div>
      `;
    }).join('');
  }

  heroList.addEventListener('click', (e) => {
    const menuBtn = e.target.closest('.challenge-menu-btn');
    if(menuBtn){
      e.stopPropagation();
      const card = menuBtn.closest('.challenge-card');
      const dropdown = menuBtn.nextElementSibling;
      document.querySelectorAll('.note-menu-dropdown').forEach(d => { if(d !== dropdown) d.classList.remove('show') });
      document.querySelectorAll('.note-card, .challenge-card').forEach(c => c.style.zIndex = '');
      dropdown.classList.toggle('show');
      if(dropdown.classList.contains('show')) card.style.zIndex = '99';
      return;
    }

    const menuItem = e.target.closest('.note-menu-item');
    if(menuItem){
      e.stopPropagation();
      document.querySelectorAll('.note-menu-dropdown').forEach(d => d.classList.remove('show'));
      document.querySelectorAll('.challenge-card').forEach(c => c.style.zIndex = '');
      const card = menuItem.closest('.challenge-card');
      const id = card.dataset.id;
      const action = menuItem.dataset.action;
      
      if(action === 'edit-hero'){ activeHeroId = id; openHeroSheet('edit'); } 
      else if(action === 'delete-hero'){
        challenges = challenges.filter(c => c.id !== id);
        completedChallenges.done = completedChallenges.done.filter(x => x !== id);
        localStorage.setItem('ios_hero_v1', JSON.stringify(completedChallenges));
        persistChallenges(); renderHero(); renderHomeWidgets(); showToast('Tantangan dihapus');
      }
      return;
    }

    const btn = e.target.closest('.sword-btn');
    if(btn) {
      document.querySelectorAll('.note-menu-dropdown').forEach(d => d.classList.remove('show'));
      toggleHero(btn.dataset.id);
    }
  });

  function openHeroSheet(mode){
    heroSheetMode = mode;
    heroSheetTitleLabel.textContent = mode === 'create' ? 'Tantangan Baru' : 'Edit Tantangan';
    if(mode === 'edit' && activeHeroId){
      const c = challenges.find(x=>x.id===activeHeroId);
      heroFieldTitle.value = c ? c.title : '';
      heroFieldXp.value = c ? c.xp : '';
    } else { heroFieldTitle.value = ''; heroFieldXp.value = ''; }
    scrim.classList.add('show'); heroSheet.classList.add('show');
    document.body.style.overflow = 'hidden';
    setTimeout(()=> heroFieldTitle.focus(), 320);
  }
  function closeHeroSheet(){
    heroSheet.classList.remove('show');
    if(!sheet.classList.contains('show') && !habitSheet.classList.contains('show')) scrim.classList.remove('show');
    document.body.style.overflow = ''; heroSheetMode = null;
  }
  function saveHeroSheet(){
    const title = heroFieldTitle.value.trim();
    const xp = heroFieldXp.value.trim() || '+50 XP';
    if(!title) { showToast('Isi nama tantangan!'); return; }
    if(heroSheetMode === 'create'){
      challenges.push({ id: uid('c'), title, xp });
      persistChallenges(); renderHero(); closeHeroSheet(); renderHomeWidgets(); showToast('Ditambahkan');
    } else if(heroSheetMode === 'edit' && activeHeroId){
      const c = challenges.find(x=>x.id===activeHeroId);
      if(c){ c.title = title; c.xp = xp; persistChallenges(); }
      closeHeroSheet(); renderHero(); renderHomeWidgets(); showToast('Tersimpan');
    }
  }
  heroSheetCancel.addEventListener('click', closeHeroSheet);
  heroSheetSave.addEventListener('click', saveHeroSheet);


  /** ===================== HOME WIDGETS ===================== */
  let autoScrollIntervals = [];

  function renderHomeWidgets(){
    if (activeTab !== 'home') return;
    
    autoScrollIntervals.forEach(clearInterval);
    autoScrollIntervals = [];

    const impNotes = notes.filter(n => n.isImportant && !n.isDone && !n.isArchived).sort((a,b)=> b.updatedAt - a.updatedAt);
    const incompleteHabits = habits.filter(h => !isDoneOn(h, todayKey()));
    
    const completedHabitsToday = habits.filter(h => isDoneOn(h, todayKey())).length;
    const totalHabits = habits.length;
    const totalNotes = notes.length;
    
    const heroDoneCount = completedChallenges.done.length;
    const heroTotal = challenges.length;

    let html = `
      <div class="widget-section" style="margin-bottom: var(--sp-2);">
        <div class="widget-item hero" onclick="switchTab('hero');" style="flex-direction: row; justify-content: flex-start; align-items: center; gap: 16px;">
          <div class="w-icon hero" style="margin: 0; width: 48px; height: 48px; font-size: 24px;"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/></svg></div>
          <div class="w-content" style="flex: 1;">
            <h4 class="w-title hero-text" style="font-size: 24px; margin-bottom: 2px;">${heroDoneCount} / ${heroTotal}</h4>
            <p class="w-desc hero-text">Tantangan Selesai</p>
          </div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-box habit-stat" onclick="switchTab('habits')">

          <h4>${completedHabitsToday}/${totalHabits}</h4>
          <p>Habits Selesai Hari Ini</p>
        </div>
        <div class="stat-box note-stat" onclick="switchTab('notes')">
          <h4>${totalNotes}</h4>
          <p>Total Catatan</p>
        </div>
      </div>
    `;

    if (impNotes.length > 0) {
      html += `
        <div class="widget-section">
          <h3 class="widget-title">Important Notes</h3>
          <div class="widget-carousel" id="carousel-imp">
            ${impNotes.map(n => `
              <div class="widget-item important" onclick="switchTab('notes'); setTimeout(()=>openDetail('${n.id}', false), 10);">
                <div class="w-icon important"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16 11V7a4 4 0 00-8 0v4H6v10h12V11h-2zm-4 7c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg></div>
                <div class="w-content">
                  <h4 class="w-title">${escapeHtml(n.title || 'Untitled')}</h4>
                  <p class="w-desc">${escapeHtml(n.body || '')}</p>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="widget-dots" id="dots-imp">
            ${impNotes.map((_, i) => `<div class="w-dot ${i===0?'active':''}"></div>`).join('')}
          </div>
        </div>
      `;
    }

    if (incompleteHabits.length > 0) {
      html += `
        <div class="widget-section" style="margin-top: 10px;">
          <h3 class="widget-title">Habits to Complete</h3>
          <div class="widget-carousel" id="carousel-hab">
            ${incompleteHabits.map(h => `
              <div class="widget-item habit" onclick="switchTab('habits'); setTimeout(()=>openHabitDetail('${h.id}', false), 10);">
                <div class="w-icon habit" style="background:${h.color}2a; color:${h.color}">${h.emoji}</div>
                <div class="w-content">
                  <h4 class="w-title">${escapeHtml(h.name)}</h4>
                  <p class="w-desc">Don't break your streak!</p>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="widget-dots" id="dots-hab">
            ${incompleteHabits.map((_, i) => `<div class="w-dot ${i===0?'active':''}"></div>`).join('')}
          </div>
        </div>
      `;
    }

    if (impNotes.length === 0 && incompleteHabits.length === 0) {
      html += `
        <div class="empty-state show" style="margin-top: 4vh;">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
          <h2>All Caught Up!</h2>
          <p>No important notes or pending habits today.</p>
        </div>
      `;
    }

    homeWidgets.innerHTML = html;
    setupCarousel('carousel-imp', 'dots-imp');
    setupCarousel('carousel-hab', 'dots-hab');
  }

  function setupCarousel(carId, dotsId) {
    const car = document.getElementById(carId);
    const dotsContainer = document.getElementById(dotsId);
    if (!car || !dotsContainer) return;

    const dots = dotsContainer.querySelectorAll('.w-dot');
    const total = dots.length;
    if (total <= 1) return;

    let currentIndex = 0;
    const updateDots = () => {
      const itemWidth = car.scrollWidth / total;
      currentIndex = Math.round(car.scrollLeft / itemWidth);
      if (currentIndex >= total) currentIndex = total - 1;
      dots.forEach((d, i) => d.classList.toggle('active', i === currentIndex));
    };

    car.addEventListener('scroll', updateDots);
    const int = setInterval(() => {
      let nextIndex = (currentIndex + 1) % total;
      const itemWidth = car.scrollWidth / total;
      car.scrollTo({ left: nextIndex * itemWidth, behavior: 'smooth' });
    }, 3500);
    autoScrollIntervals.push(int);
  }
  /** ===================== HABIT SHEET ===================== */
  function buildEmojiGrid(){
    emojiGrid.innerHTML = EMOJI_OPTS.map(em=>`<button type="button" class="emoji-opt ${em===selectedEmoji?'selected':''}" data-emoji="${em}">${em}</button>`).join('');
  }
  function buildColorGrid(){
    colorGrid.innerHTML = COLOR_OPTS.map(c=>`<button type="button" class="color-opt ${c===selectedColor?'selected':''}" data-color="${c}" style="background:${c};"></button>`).join('');
  }
  emojiGrid.addEventListener('click', (e)=>{
    const b = e.target.closest('.emoji-opt'); if(!b) return;
    selectedEmoji = b.dataset.emoji; buildEmojiGrid();
  });
  colorGrid.addEventListener('click', (e)=>{
    const b = e.target.closest('.color-opt'); if(!b) return;
    selectedColor = b.dataset.color; buildColorGrid();
  });

  function openHabitSheet(mode){
    habitSheetMode = mode;
    habitSheetTitleLabel.textContent = mode==='create' ? 'New Habit' : 'Edit Habit';
    if(mode==='edit' && activeHabitId){
      const h = habits.find(x=>x.id===activeHabitId);
      habitFieldName.value = h ? h.name : '';
      selectedEmoji = h ? h.emoji : EMOJI_OPTS[0];
      selectedColor = h ? h.color : COLOR_OPTS[0];
    } else {
      habitFieldName.value = '';
      selectedEmoji = EMOJI_OPTS[0];
      selectedColor = COLOR_OPTS[0];
    }
    buildEmojiGrid(); buildColorGrid();
    scrim.classList.add('show');
    habitSheet.classList.add('show');
    document.body.style.overflow = 'hidden';
    setTimeout(()=> habitFieldName.focus(), 320);
  }
  function closeHabitSheet(){
    habitSheet.classList.remove('show');
    if(!sheet.classList.contains('show')) scrim.classList.remove('show');
    document.body.style.overflow = '';
    habitSheetMode = null;
  }
  function saveHabitSheet(){
    const name = habitFieldName.value.trim();
    if(!name){ showToast('Give your habit a name'); return; }
    if(habitSheetMode==='create'){
      habits.push({ id: uid('h'), name, emoji: selectedEmoji, color: selectedColor, createdAt: Date.now(), completions: {} });
      persistHabits(); renderHabits(); closeHabitSheet(); showToast('Habit created');
    } else if(habitSheetMode==='edit' && activeHabitId){
      const h = habits.find(x=>x.id===activeHabitId);
      if(h){ h.name = name; h.emoji = selectedEmoji; h.color = selectedColor; persistHabits(); }
      closeHabitSheet(); renderHabits(); openHabitDetail(activeHabitId, false); showToast('Habit saved');
    }
  }
  habitSheetCancel.addEventListener('click', closeHabitSheet);
  habitSheetSave.addEventListener('click', saveHabitSheet);

  /** ===================== HABIT DETAIL ===================== */
  function openHabitDetail(id, animate){
    const h = habits.find(x=>x.id===id);
    if(!h) return;
    activeHabitId = id;
    calCursor = new Date();
    renderHabitDetail(id);

    habitDetailView.classList.add('show');
    document.body.style.overflow = 'hidden';
    if(animate===false){ habitDetailView.classList.add('enter'); }
    else{ requestAnimationFrame(()=> requestAnimationFrame(()=> habitDetailView.classList.add('enter'))); }
  }
  function closeHabitDetail(){
    habitDetailView.classList.remove('enter');
    document.body.style.overflow = '';
    setTimeout(()=>{ habitDetailView.classList.remove('show'); activeHabitId = null; }, 350);
  }
  function renderHabitDetail(id){
    const h = habits.find(x=>x.id===id);
    if(!h) return;
    habitDetailEmoji.style.background = h.color + '2a';
    habitDetailEmoji.textContent = h.emoji;
    habitDetailTitle.textContent = h.name;
    habitDetailSub.textContent = 'Created ' + formatDate(h.createdAt);
    statCurrent.textContent = calcCurrentStreak(h);
    statBest.textContent = calcBestStreak(h);
    statTotal.textContent = getCompletedDates(h).length;
    renderCalendar(h);
  }

  function renderCalendar(h){
    const y = calCursor.getFullYear(), m = calCursor.getMonth();
    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    calMonthLabel.textContent = `${monthNames[m]} ${y}`;

    const now = new Date();
    const isCurrentMonth = (y===now.getFullYear() && m===now.getMonth());
    calNext.disabled = isCurrentMonth;

    const firstDay = new Date(y,m,1);
    const daysInMonth = new Date(y,m+1,0).getDate();
    const startOffset = firstDay.getDay();

    let cellsHtml = DOW_LETTERS.map(l=>`<div class="cal-dow">${l}</div>`).join('');
    for(let i=0;i<startOffset;i++){ cellsHtml += `<div class="cal-cell empty"></div>`; }

    for(let day=1; day<=daysInMonth; day++){
      const d = new Date(y,m,day);
      const key = dateKey(d);
      const done = isDoneOn(h,key);
      const isFuture = d > now && key !== todayKey();
      const isToday = key === todayKey();
      cellsHtml += `<div class="cal-cell ${done?'done':''} ${isFuture?'future':''} ${isToday?'today':''}"
        data-key="${key}" style="${done?`background:${h.color};`:''}">${day}</div>`;
    }

    calGrid.innerHTML = cellsHtml;
  }

  calGrid.addEventListener('click', (e)=>{
    const cell = e.target.closest('.cal-cell');
    if(!cell || cell.classList.contains('empty') || cell.classList.contains('future')) return;
    if(!activeHabitId) return;
    toggleCompletion(activeHabitId, cell.dataset.key);
  });
  calPrev.addEventListener('click', ()=>{
    calCursor.setMonth(calCursor.getMonth()-1);
    const h = habits.find(x=>x.id===activeHabitId);
    if(h) renderCalendar(h);
  });
  calNext.addEventListener('click', ()=>{
    if(calNext.disabled) return;
    calCursor.setMonth(calCursor.getMonth()+1);
    const h = habits.find(x=>x.id===activeHabitId);
    if(h) renderCalendar(h);
  });

  habitBackBtn.addEventListener('click', closeHabitDetail);
  habitEditBtn.addEventListener('click', ()=>{ if(activeHabitId) openHabitSheet('edit'); });
  habitDeleteBtn.addEventListener('click', ()=>{ if(activeHabitId) askDelete('habit', activeHabitId); });

  /** ===================== DELETE (shared dialog) ===================== */
  function askDelete(type, id){
    pendingDelete = { type, id };
    dialogTitle.textContent = type==='note' ? 'Delete this note?' : 'Delete this habit?';
    scrim.classList.add('show');
    deleteDialog.classList.add('show');
  }
  function closeDeleteDialog(){
    deleteDialog.classList.remove('show');
    if(!sheet.classList.contains('show') && !habitSheet.classList.contains('show')) scrim.classList.remove('show');
    pendingDelete = null;
  }
  function confirmDelete(){
    const pd = pendingDelete;
    closeDeleteDialog();
    if(!pd) return;
    if(pd.type==='note'){
      notes = notes.filter(n=>n.id!==pd.id);
      persistNotes();
      if(activeNoteId===pd.id) closeDetail();
      renderNotes();
      showToast('Note deleted');
    } else {
      habits = habits.filter(h=>h.id!==pd.id);
      persistHabits();
      if(activeHabitId===pd.id) closeHabitDetail();
      renderHabits();
      showToast('Habit deleted');
    }
  }
  dialogCancel.addEventListener('click', closeDeleteDialog);
  dialogConfirm.addEventListener('click', confirmDelete);

  scrim.addEventListener('click', ()=>{
    if(deleteDialog.classList.contains('show')) closeDeleteDialog();
    else if(sheet.classList.contains('show')) closeSheet();
    else if(habitSheet.classList.contains('show')) closeHabitSheet();
  });

  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape'){
      if(deleteDialog.classList.contains('show')) closeDeleteDialog();
      else if(sheet.classList.contains('show')) closeSheet();
      else if(habitSheet.classList.contains('show')) closeHabitSheet();
      else if(detailView.classList.contains('show')) closeDetail();
      else if(habitDetailView.classList.contains('show')) closeHabitDetail();
    }
    if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){
      if(sheet.classList.contains('show')) saveSheet();
      else if(habitSheet.classList.contains('show')) saveHabitSheet();
    }
  });

       document.addEventListener('click', (e)=>{
    if(!e.target.closest('.note-menu-btn') && !e.target.closest('.challenge-menu-btn')) {
      document.querySelectorAll('.note-menu-dropdown').forEach(d => d.classList.remove('show'));
      document.querySelectorAll('.note-card, .challenge-card').forEach(c => c.style.zIndex = '');
    }
  });

  /** ===================== INIT ===================== */
  loadAll();
  renderNotes();
  renderHabits();
  switchTab('home');

})();
</script>
